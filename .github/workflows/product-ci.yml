# Product checks for the fork.
# Guards the upstream code boundary and builds the solution for every change of product/main,
# including upstream sync PRs and pushes after merge (catches a squash-merged sync).

name: Product CI

on:
  push:
    branches:
      - product/main
  pull_request:
    branches:
      - product/main
  workflow_dispatch:

permissions:
  contents: read

env:
  UPSTREAM_URL: https://github.com/RockSolidKnowledge/Open.IdentityServer.git

jobs:
  upstream-boundary:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Fetch upstream release tags
        run: git fetch --no-tags "$UPSTREAM_URL" '+refs/tags/*:refs/upstream-tags/*'

      - name: Reject numeric tags created in the fork
        run: |
          fmt='%(refname:strip=2) %(if)%(*objectname)%(then)%(*objectname)%(else)%(objectname)%(end)'
          git for-each-ref --format="$fmt" 'refs/tags/[0-9]*' | sort > "$RUNNER_TEMP/fork-tags"
          git for-each-ref --format="$fmt" 'refs/upstream-tags/[0-9]*' | sort > "$RUNNER_TEMP/upstream-tags"
          comm -23 "$RUNNER_TEMP/fork-tags" "$RUNNER_TEMP/upstream-tags" > "$RUNNER_TEMP/foreign-tags"
          if [ -s "$RUNNER_TEMP/foreign-tags" ]; then
            echo "::error::Numeric tags belong to upstream. These fork tags are missing upstream or point elsewhere:"
            cat "$RUNNER_TEMP/foreign-tags"
            exit 1
          fi

      - name: Validate .claude/settings.json
        run: jq empty .claude/settings.json

      - name: Lint product scripts
        run: shellcheck -S warning product/scripts/*.sh product/scripts/hooks/pre-commit

      - name: Check upstream boundary
        env:
          UPSTREAM_TAG_NS: refs/upstream-tags
        run: bash product/scripts/check-upstream-boundary.sh HEAD

  product-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Run build script
        run: bash ./build.sh
